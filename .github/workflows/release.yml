name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu      # x64
          - armv7-unknown-linux-gnueabihf # armv7l

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary for upload
        run: |
          mv target/${{ matrix.target }}/release/modbus-proxy-rs modbus-proxy-rs-${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: modbus-proxy-rs-${{ matrix.target }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          # Move and rename x64 binary
          mv artifacts/binary-x86_64-unknown-linux-gnu/modbus-proxy-rs-x86_64-unknown-linux-gnu release_assets/modbus-proxy-rs-x64-linux
          # Move and rename armv7l binary
          mv artifacts/binary-armv7-unknown-linux-gnueabihf/modbus-proxy-rs-armv7-unknown-linux-gnueabihf release_assets/modbus-proxy-rs-armv7l-linux
          
          # Ensure execution permissions
          chmod +x release_assets/*

      - name: Generate tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Created tag main-${SHORT_SHA}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: release_assets/*
          generate_release_notes: true
