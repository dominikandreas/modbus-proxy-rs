name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: modbus-proxy-rs-x86_64-unknown-linux-gnu.tar.gz
            use_cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_name: modbus-proxy-rs-x86_64-unknown-linux-musl.tar.gz
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_name: modbus-proxy-rs-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            archive_name: modbus-proxy-rs-armv7-unknown-linux-gnueabihf.tar.gz
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: modbus-proxy-rs-x86_64-pc-windows-msvc.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@cross

      - name: Build binary with cross
        if: ${{ matrix.use_cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Build binary with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/modbus-proxy-rs-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/modbus-proxy-rs dist/modbus-proxy-rs-${{ matrix.target }}/modbus-proxy-rs
          cp README.md LICENSE dist/modbus-proxy-rs-${{ matrix.target }}/
          tar -C dist -czf "${{ matrix.archive_name }}" "modbus-proxy-rs-${{ matrix.target }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/modbus-proxy-rs-${{ matrix.target }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/modbus-proxy-rs.exe" "dist/modbus-proxy-rs-${{ matrix.target }}/modbus-proxy-rs.exe"
          Copy-Item README.md, LICENSE "dist/modbus-proxy-rs-${{ matrix.target }}/"
          Compress-Archive -Path "dist/modbus-proxy-rs-${{ matrix.target }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.archive_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release_assets/ \;
          sha256sum release_assets/* > release_assets/SHA256SUMS.txt

      - name: Generate tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Created tag main-${SHORT_SHA}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: release_assets/*
          generate_release_notes: true
